# DevTrace corpus sources. Pinned to full commit SHAs (tags can move). Explicit file lists: nothing is crawled.
# Fetched ONLY via app/devtrace/corpus/safe_fetch.py from the host(s) in allowed_hosts. Both sources are MIT-licensed;
# raw files stay in a git-ignored cache, only this file + manifest.json are committed (see NOTICE.md).
# 'docs_as_of' pages describe the pinned ref; release-note sections carry their own version/date from the heading.
# skip_headings: release-note subsections that only list translation/CI/doc-typo PRs. Chosen in phase 2; revisit if eval shows misses.
allowed_hosts:
- raw.githubusercontent.com

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Project 1 benchmark results</title>
  <desc id="description">Comparison of always-large, routing-only, cache-only, and full Project 1 benchmark arms on 78 validated questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #9aabc2; }
      .body { fill: #dbe6f4; }
      .panel { fill: #111d2f; stroke: #26364d; stroke-width: 1.5; }
      .label { fill: #9aabc2; font-size: 15px; font-weight: 650; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1480" cy="28" r="230" fill="#15364a" opacity=".20"/>
  <circle cx="20" cy="1110" r="270" fill="#103c37" opacity=".16"/>

  <text x="76" y="72" fill="#5eead4" font-size="15" font-weight="700" letter-spacing="2.6">RAG PLATFORM  /  PROJECT 1</text>
  <text x="76" y="130" fill="#f4f8fc" font-size="44" font-weight="750">Cache + routing benchmark</text>
  <text x="76" y="168" class="muted" font-size="18">Four ablation arms · 78 validated questions · original, paraphrase, and repeat passes</text>
  <rect x="1290" y="68" width="234" height="42" rx="21" fill="#12352f" stroke="#23745f"/>
  <circle cx="1315" cy="89" r="6" fill="#34d399"/>
  <text x="1331" y="95" fill="#a7f3d0" font-size="14" font-weight="700" letter-spacing=".7">COMPLETED BENCHMARK</text>
  <rect x="76" y="197" width="1448" height="2" fill="url(#accent)" opacity=".8"/>

  <text x="76" y="241" class="label">OVERALL ARM COMPARISON  ·  234 REQUESTS PER ARM</text>
  <rect x="76" y="263" width="1448" height="360" rx="16" class="panel"/>
  <rect x="76" y="263" width="1448" height="61" rx="16" fill="#17263a"/>
  <rect x="76" y="308" width="1448" height="16" fill="#17263a"/>

  <text x="105" y="301" class="label">ARM</text>
  <text x="470" y="301" class="label" text-anchor="middle">COST / REQUEST</text>
  <text x="700" y="301" class="label" text-anchor="middle">QUALITY</text>
  <text x="925" y="301" class="label" text-anchor="middle">P95 LATENCY</text>
  <text x="1152" y="301" class="label" text-anchor="middle">CACHE HITS</text>
  <text x="1412" y="301" class="label" text-anchor="middle">RETRIEVAL HIT</text>

  <line x1="96" y1="399" x2="1504" y2="399" stroke="#26364d"/>
  <line x1="96" y1="474" x2="1504" y2="474" stroke="#26364d"/>
  <line x1="96" y1="549" x2="1504" y2="549" stroke="#26364d"/>
  <rect x="92" y="550" width="1416" height="66" rx="10" fill="#12352f" opacity=".62"/>

  <text x="105" y="370" fill="#f4f8fc" font-size="20" font-weight="700">always_large</text>
  <text x="470" y="370" class="body" font-size="19" text-anchor="middle">$0.00024</text>
  <text x="700" y="370" class="body" font-size="19" text-anchor="middle">78.6%</text>
  <text x="925" y="370" class="body" font-size="19" text-anchor="middle">1.99 s</text>
  <text x="1152" y="370" class="body" font-size="19" text-anchor="middle">0.0%</text>
  <text x="1412" y="370" class="body" font-size="19" text-anchor="middle">92.3%</text>

  <text x="105" y="445" fill="#f4f8fc" font-size="20" font-weight="700">routing_only</text>
  <text x="470" y="445" fill="#fca5a5" font-size="19" text-anchor="middle">$0.00047  (+94.4%)</text>
  <text x="700" y="445" class="body" font-size="19" text-anchor="middle">82.5%</text>
  <text x="925" y="445" fill="#fca5a5" font-size="19" text-anchor="middle">6.86 s  (+245.3%)</text>
  <text x="1152" y="445" class="body" font-size="19" text-anchor="middle">0.0%</text>
  <text x="1412" y="445" class="body" font-size="19" text-anchor="middle">92.3%</text>

  <text x="105" y="520" fill="#f4f8fc" font-size="20" font-weight="700">cache_only</text>
  <text x="470" y="520" fill="#5eead4" font-size="19" text-anchor="middle">$0.00012  (−50.6%)</text>
  <text x="700" y="520" class="body" font-size="19" text-anchor="middle">79.5%</text>
  <text x="925" y="520" fill="#5eead4" font-size="19" text-anchor="middle">1.23 s  (−38.1%)</text>
  <text x="1152" y="520" class="body" font-size="19" text-anchor="middle">50.9%</text>
  <text x="1412" y="520" class="body" font-size="19" text-anchor="middle">92.3%</text>

  <text x="105" y="595" fill="#a7f3d0" font-size="20" font-weight="750">full</text>
  <text x="470" y="595" fill="#a7f3d0" font-size="19" font-weight="700" text-anchor="middle">$0.00017  (−28.6%)</text>
  <text x="700" y="595" fill="#a7f3d0" font-size="19" font-weight="700" text-anchor="middle">80.8%</text>
  <text x="925" y="595" fill="#fca5a5" font-size="19" font-weight="700" text-anchor="middle">11.43 s  (+475.3%)</text>
  <text x="1152" y="595" fill="#a7f3d0" font-size="19" font-weight="700" text-anchor="middle">52.6%</text>
  <text x="1412" y="595" fill="#a7f3d0" font-size="19" font-weight="700" text-anchor="middle">92.3%</text>

  <text x="76" y="678" class="label">WHAT THIS RUN SUPPORTS</text>
  <g>
    <rect x="76" y="700" width="700" height="170" rx="16" class="panel"/>
    <text x="108" y="744" fill="#f4f8fc" font-size="22" font-weight="700">Full arm vs always-large</text>
    <text x="108" y="786" class="body" font-size="18">Quality difference: <tspan fill="#a7f3d0" font-weight="700">+0.021</tspan></text>
    <text x="108" y="819" class="body" font-size="18">95% bootstrap CI: <tspan fill="#dbe6f4" font-weight="700">[−0.021, +0.068]</tspan></text>
    <text x="108" y="849" fill="#a7f3d0" font-size="15" font-weight="700">No-quality-drop claim supported at a 0.05 margin (78 paired items).</text>

    <rect x="800" y="700" width="724" height="170" rx="16" fill="#2a1b27" stroke="#694154" stroke-width="1.5"/>
    <text x="832" y="744" fill="#fda4af" font-size="22" font-weight="700">Latency trade-off to investigate</text>
    <text x="832" y="786" class="body" font-size="18">Full arm p95 was <tspan fill="#fda4af" font-weight="700">11.43 s</tspan>, compared with</text>
    <text x="832" y="816" class="body" font-size="18">1.99 s for always-large (<tspan fill="#fda4af" font-weight="700">+475.3%</tspan> in this run).</text>
    <text x="832" y="849" class="muted" font-size="15">Routing-only also increased cost and p95 versus the reference.</text>
  </g>

  <text x="76" y="920" class="label">MODEL &amp; WORKLOAD</text>
  <rect x="76" y="940" width="1448" height="100" rx="16" class="panel"/>
  <text x="108" y="979" class="body" font-size="16">small: ollama/nemotron-3-nano:30b-cloud   ·   large / judge: ollama/gemma4:31b:cloud</text>
  <text x="108" y="1010" class="muted" font-size="15">78 validated questions × 3 passes = 234 requests/arm · 92.3% retrieval-hit rate across all arms</text>
  <text x="76" y="1080" class="muted" font-size="13">Source: results/project1_report.md and project1_summary.json · cost is the configured price-table estimate, not a verified provider invoice.</text>
</svg>

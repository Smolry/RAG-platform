services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
    ports: ["5433:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
  neo4j:   # Project 3 only (GraphRAG). Not needed for the baseline, Project 2 or Project 1.
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/rag-dev-password          # must match NEO4J_PASSWORD in .env
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p rag-dev-password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
volumes: {qdrant_data: {}, pg_data: {}, neo4j_data: {}}
